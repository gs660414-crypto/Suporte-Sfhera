name: Sfhera Suporte - Instalar servidor

# Instala o servidor do RustDesk (hbbs/hbbr) na VPS (KingHost), portas padrão 21115-21119,
# com firewall (ufw) e fail2ban, e sem limites de velocidade/tempo no relay.
# e mostra a chave pública no log.
# Precisa do segredo VPS_SENHA (senha de root da VPS).
# Rodar de novo: altere esta linha. (3)
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/sfhera-servidor.yml"

env:
  VPS_IP: "191.252.208.223"
  VPS_SSH_PORTA: "22"

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar servidor na VPS
        env:
          SSHPASS: ${{ secrets.VPN_SENHA || secrets.VPS_SENHA }}
        run: |
          set -e
          if [ -z "$SSHPASS" ]; then echo "Falta o segredo VPS_SENHA"; exit 1; fi
          if [ "$VPS_IP" = "IP_DA_KINGHOST" ]; then echo "IP do servidor novo ainda nao definido"; exit 0; fi
          sudo apt-get install -y sshpass >/dev/null
          cat > instalar.sh <<'EOS'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y >/dev/null
          apt-get install -y curl unzip >/dev/null
          case "$(uname -m)" in
            x86_64) ARQ=amd64 ;;
            aarch64) ARQ=arm64v8 ;;
            *) echo "Arquitetura nao suportada: $(uname -m)"; exit 1 ;;
          esac
          TAG=$(curl -fsSL https://api.github.com/repos/rustdesk/rustdesk-server/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)
          cd /tmp && rm -rf rds && mkdir rds && cd rds
          curl -fsSL -o s.zip "https://github.com/rustdesk/rustdesk-server/releases/download/${TAG}/rustdesk-server-linux-${ARQ}.zip"
          unzip -q s.zip
          mkdir -p /opt/rustdesk
          systemctl stop rustdesk-hbbs rustdesk-hbbr 2>/dev/null || true
          install -m 755 */hbbs */hbbr /opt/rustdesk/
          for s in hbbs hbbr; do
            cat > /etc/systemd/system/rustdesk-$s.service <<EOF
          [Unit]
          Description=RustDesk $s (Sfhera Suporte)
          After=network.target
          [Service]
          WorkingDirectory=/opt/rustdesk
          Environment=TOTAL_BANDWIDTH=10240 SINGLE_BANDWIDTH=1024 LIMIT_SPEED=1024 DOWNGRADE_THRESHOLD=1000 DOWNGRADE_START_CHECK=86400
          ExecStart=/opt/rustdesk/$s $([ $s = hbbs ] && echo "-r __VPS_IP__:21117")
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF
          done
          systemctl daemon-reload
          systemctl enable --now rustdesk-hbbs rustdesk-hbbr
          # Protecao: firewall so com as portas necessarias + fail2ban contra tentativa de senha
          # VPS dedicada: firewall so com SSH + portas do Sfhera Suporte, e fail2ban
          apt-get install -y ufw fail2ban >/dev/null
          ufw allow "${SSH_PORTA}/tcp"; ufw allow 22/tcp; ufw allow 21115:21119/tcp; ufw allow 21116/udp
          ufw --force enable
          echo "== servicos escutando antes/depois:"; ss -tlnp | awk 'NR>1{print $4, $6}' | sort -u | head -30
          printf '[sshd]\nenabled = true\nport = %s\nmaxretry = 5\nbantime = 1h\n' "$SSH_PORTA" > /etc/fail2ban/jail.d/sshd.local
          systemctl enable --now fail2ban; systemctl restart fail2ban
          sleep 5
          systemctl is-active rustdesk-hbbs rustdesk-hbbr
          echo "CHAVE_PUBLICA=$(cat /opt/rustdesk/id_ed25519.pub)"
          EOS
          sed -i "s/__VPS_IP__/$VPS_IP/g" instalar.sh
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -p "$VPS_SSH_PORTA" root@"$VPS_IP" "SSH_PORTA=$VPS_SSH_PORTA bash -s" < instalar.sh
      - name: Testar portas de fora
        run: |
          for p in 21115 21116 21117; do
            timeout 5 bash -c "echo > /dev/tcp/$VPS_IP/$p" && echo "porta $p ok" || echo "porta $p FECHADA"
          done
