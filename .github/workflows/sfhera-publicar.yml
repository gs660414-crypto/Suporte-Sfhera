name: Sfhera Suporte - Publicar link fixo

# Copia o instalador do Windows da release "sfhera" com o nome SfheraSuporte.exe,
# e o APK do Android como SfheraSuporte.apk, para os links fixos sempre baixarem a versão mais nova.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sfhera Suporte - Windows", "Sfhera Suporte - Android"]
    types: [completed]
  push:
    branches: [master]
    paths:
      - ".github/workflows/sfhera-publicar.yml"

permissions:
  contents: write

jobs:
  publicar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Copiar instalador como SfheraSuporte.exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if gh release download sfhera -R "${{ github.repository }}" -p 'rustdesk-*-x86_64.exe' -O SfheraSuporte.exe; then
            gh release upload sfhera SfheraSuporte.exe -R "${{ github.repository }}" --clobber
          fi
          if gh release download sfhera -R "${{ github.repository }}" -p 'rustdesk-*-universal.apk' -O SfheraSuporte.apk; then
            gh release upload sfhera SfheraSuporte.apk -R "${{ github.repository }}" --clobber
          fi
